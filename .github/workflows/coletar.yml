name: Atualizar dados do SC2 Pulse

on:
  workflow_dispatch:       # botão "Run workflow" na aba Actions do GitHub
    inputs:
      recalcular_matchups:
        description: "Recalcular winrate por matchup (mais lento, uns 10 minutos)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python coletor/coletar.py
        env:
          RECALCULAR_MATCHUPS: ${{ inputs.recalcular_matchups && '1' || '' }}
      - name: Salvar dados no repositório
        run: |
          git config user.name "coletor-sc2"
          git config user.email "coletor-sc2@users.noreply.github.com"
          git add docs/data dados
          git diff --cached --quiet || git commit -m "Dados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
